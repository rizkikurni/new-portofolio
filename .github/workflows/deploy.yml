name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://rizkikurni.my.id

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p 22 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'DEPLOY_SCRIPT'
              set -Eeuo pipefail

              APP_DIR=/var/www/new-portofolio
              PHP_BIN=/usr/bin/php8.3
              COMPOSER_BIN=/usr/local/bin/composer

              cd "$APP_DIR"

              test -d .git || {
                echo "Deployment failed: $APP_DIR is not a Git repository."
                exit 1
              }

              test -f .env || {
                echo "Deployment failed: $APP_DIR/.env does not exist."
                exit 1
              }

              "$PHP_BIN" artisan down --retry=10
              trap '"$PHP_BIN" artisan up' EXIT

              git fetch origin main
              git checkout main
              git pull --ff-only origin main

              "$PHP_BIN" "$COMPOSER_BIN" install \
                --no-dev \
                --prefer-dist \
                --no-interaction \
                --no-progress \
                --optimize-autoloader

              npm ci --no-audit --no-fund
              npm run build

              "$PHP_BIN" artisan migrate --force
              "$PHP_BIN" artisan storage:link || true
              "$PHP_BIN" artisan optimize:clear
              "$PHP_BIN" artisan config:cache
              "$PHP_BIN" artisan route:cache
              "$PHP_BIN" artisan view:cache

              "$PHP_BIN" artisan up
              trap - EXIT
          DEPLOY_SCRIPT
